<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>连连瑞瑞看</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#eaf7d9;
  background-image:
    radial-gradient(circle at 18% 12%, rgba(255,255,255,.55) 0, rgba(255,255,255,0) 42%),
    radial-gradient(circle at 82% 78%, rgba(183,228,138,.7) 0, rgba(183,228,138,0) 46%);
  color:#2f5b24;
  user-select:none;
}
.page{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:0 14px 14px;overflow:hidden}
.hidden{display:none!important}
/* ---------- 开始页 ---------- */
#startPage{justify-content:flex-start;padding-top:14px;overflow-y:auto}
.userCard{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:7px 18px 7px 7px;box-shadow:0 3px 0 #cbe7ae,0 6px 14px rgba(76,124,45,.12);cursor:pointer}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#d8f0bd;border:2px solid #9fd06f;flex:0 0 auto}
.avatarEmoji{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:#d8f0bd;border:2px solid #9fd06f;flex:0 0 auto}
.uname{font-size:16px;font-weight:700;color:#2f5b24}
.usub{font-size:11px;color:#7c9c67;margin-top:2px}
.mascotBig{width:min(46vw,190px);margin:14px 0 2px;animation:floaty 3.4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.title{font-size:clamp(26px,8.2vw,40px);font-weight:900;color:#4f9c31;letter-spacing:2px;margin:6px 0 0;text-shadow:0 3px 0 #d6efb9}
.subtitle{font-size:13px;color:#6b9159;margin:6px 0 18px}
.btnPrimary{width:min(80vw,320px);padding:15px 0;border:none;border-radius:999px;background:#57b544;color:#fff;font-size:19px;font-weight:800;letter-spacing:2px;box-shadow:0 5px 0 #3d8c31,0 10px 18px rgba(61,140,49,.25);cursor:pointer}
.btnPrimary:active{transform:translateY(3px);box-shadow:0 2px 0 #3d8c31}
.rowBtns{display:flex;gap:10px;margin-top:14px}
.btnGhost{background:#fff;border:2px solid #c6e6a8;color:#3f7c2b;border-radius:14px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 #ddeecb}
.btnGhost:active{transform:translateY(2px);box-shadow:none}
.audioRow{display:flex;gap:10px;margin-top:14px}
.chipBtn{background:#fff;border:2px solid #c6e6a8;color:#3f7c2b;border-radius:999px;padding:6px 13px;font-size:12px;cursor:pointer}
.chipBtn.off{opacity:.45;text-decoration:line-through}
.rules{margin-top:16px;font-size:12px;line-height:1.9;color:#6b9159;text-align:center;max-width:330px}
.qqLink{margin:14px 0 6px;font-size:11px;color:#7c9c67;border:1px solid #cfe8b3;background:rgba(255,255,255,.7);border-radius:999px;padding:5px 12px;text-decoration:none}
/* ---------- 地图页 ---------- */
#mapPage{padding:0}
.mapHeader{width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px 6px;flex:0 0 auto}
.btnBack{background:#fff;border:2px solid #b9dd98;border-radius:12px;padding:6px 12px;font-size:13px;color:#3f7c2b;font-weight:700;cursor:pointer}
.mapTitle{flex:1;text-align:center;font-size:17px;font-weight:800;color:#4f9c31;padding-right:52px}
#mapViewport{position:relative;flex:1 1 auto;width:100%;overflow:hidden;touch-action:none;cursor:grab}
#mapViewport.grabbing{cursor:grabbing}
#mapCanvas{position:absolute;left:0;top:0;width:100%;will-change:transform}
.mapTip{flex:0 0 auto;font-size:12px;color:#6b9159;text-align:center;padding:8px 12px 12px}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.nodeDisc{position:relative;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;background:radial-gradient(circle at 34% 28%,#d7a86c,#b9834a);border:4px solid #8b5e2f;box-shadow:0 4px 0 #6f4620,0 6px 12px rgba(90,60,20,.25)}
.nodeDisc.open{background:radial-gradient(circle at 34% 28%,#e2b67c,#c08a4d)}
.nodeDisc.locked{background:radial-gradient(circle at 34% 28%,#c9d4cd,#a8b8ae);border-color:#8fa198;box-shadow:0 4px 0 #7b8d83}
.nodeStars{display:flex;gap:2px;margin-top:3px;font-size:11px;line-height:1}
.nodeStars .on{color:#ffc93c}
.nodeStars .off{color:#d8e6c6}
.node.current .nodeDisc{animation:pulse 1.8s ease-in-out infinite;box-shadow:0 0 0 0 rgba(255,216,80,.7),0 4px 0 #6f4620}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,216,80,.75),0 4px 0 #6f4620}70%{box-shadow:0 0 0 14px rgba(255,216,80,0),0 4px 0 #6f4620}100%{box-shadow:0 0 0 0 rgba(255,216,80,0),0 4px 0 #6f4620}}
.nodeMascot{position:absolute;width:62px;pointer-events:none;animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
/* ---------- 游戏页 ---------- */
#gamePage{padding:8px 10px 8px;justify-content:flex-start}
.hudRow1{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.miniUser{display:flex;align-items:center;gap:7px}
.avatarSm{width:34px;height:34px}
.unameSm{font-size:13px;font-weight:700;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hearts{display:flex;gap:3px;font-size:18px;line-height:1}
.heartDead{filter:grayscale(1);opacity:.32}
.hudRow2{width:100%;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.levelBadge{background:#57b544;color:#fff;font-size:13px;font-weight:800;border-radius:999px;padding:6px 13px;box-shadow:0 3px 0 #3d8c31;white-space:nowrap}
.timeWrap{flex:1;display:flex;align-items:center;gap:7px}
.timeBar{flex:1;height:12px;border-radius:999px;background:#dcecc8;overflow:hidden}
.timeFill{height:100%;width:100%;background:#7cc85a;border-radius:999px;transition:width .3s linear,background .3s}
.timeText{font-size:12px;color:#5f8349;min-width:38px;text-align:right}
.hudRow3{width:100%;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mascotSm{width:52px;flex:0 0 auto}
.bubble{background:#fff;border-radius:14px;padding:8px 12px;font-size:12px;color:#4a7a37;box-shadow:0 2px 0 #d9ecc2;line-height:1.5}
.hudRow4{width:100%;display:flex;gap:8px;margin-bottom:8px}
.toolBtn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:#fff;border:2px solid #c6e6a8;border-radius:12px;padding:8px 0;font-size:13px;font-weight:700;color:#3f7c2b;cursor:pointer;box-shadow:0 2px 0 #ddeecb}
.toolBtn:active{transform:translateY(2px);box-shadow:none}
.toolBtn:disabled{opacity:.45}
#boardWrap{flex:1 1 auto;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
#boardBox{position:relative;background:#fff;border-radius:16px;box-shadow:0 3px 0 #dcecc8,0 8px 20px rgba(76,124,45,.12);padding:6px}
#board{position:relative}
.tile{position:absolute;border-radius:11px;overflow:hidden;cursor:pointer;transition:transform .12s,opacity .18s;box-shadow:0 2px 0 #dfeccd,inset 0 0 0 2px #fff}
.tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile.sel{transform:scale(.9);box-shadow:0 0 0 3px #57b544,0 0 0 6px rgba(87,181,68,.35)}
.tile.gone{transform:scale(.25) rotate(12deg);opacity:0}
.tile.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tile.hint{box-shadow:0 0 0 3px #ffd84d,0 0 14px 4px rgba(255,216,77,.75)}

/* 失败弹窗：会掉泪的咪菇 */
.sadWrap{position:relative;width:116px;margin:2px auto 6px}
.sadWrap img{width:116px;display:block;animation:sadBob 2.2s ease-in-out infinite}
@keyframes sadBob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.tear{position:absolute;width:9px;height:12px;border-radius:50% 50% 55% 55%;background:linear-gradient(180deg,#8fd0ff,#5aa8f0);box-shadow:0 0 0 2px rgba(0,0,0,.12) inset;opacity:0;pointer-events:none}
.tear.l{left:29%;top:60%;animation:tearFall 1.9s ease-in infinite}
.tear.r{right:29%;top:60%;animation:tearFall 1.9s ease-in .75s infinite}
@keyframes tearFall{
  0%{opacity:0;transform:translateY(0) scale(.6)}
  12%{opacity:1;transform:translateY(2px) scale(1)}
  55%{opacity:1;transform:translateY(14px) scale(1)}
  85%{opacity:.55;transform:translateY(24px) scale(.85)}
  100%{opacity:0;transform:translateY(28px) scale(.5)}
}


.btnChallenge{width:min(80vw,320px);margin-top:10px;padding:12px 0;border:2px solid #2f7d3f;border-radius:999px;background:#eaf7d9;color:#2f7d3f;font-size:15px;font-weight:800;letter-spacing:1px;cursor:pointer;box-shadow:0 3px 0 #cbe7ae}
.btnChallenge:active{transform:translateY(2px);box-shadow:none}
.rankTabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.tabBtn{border:2px solid #c6e6a8;background:#fff;border-radius:999px;padding:6px 16px;font-size:13px;font-weight:700;color:#6b9159;cursor:pointer}
.tabBtn.on{background:#57b544;border-color:#57b544;color:#fff}

/* ---------- 弹窗 ---------- */
#modalRoot{position:fixed;inset:0;z-index:500;display:none}
#modalMask{position:absolute;inset:0;background:rgba(38,70,26,.42);backdrop-filter:blur(2px)}
#modalCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,380px);max-height:86vh;overflow-y:auto;background:#fbfff5;border-radius:22px;padding:20px 18px;box-shadow:0 6px 0 #cbe7ae,0 16px 40px rgba(40,80,20,.28)}
.modalTitle{font-size:18px;font-weight:900;color:#4f9c31;text-align:center;margin:0 0 10px}
.modalText{font-size:13px;line-height:1.8;color:#5f8349;text-align:center;margin:0 0 14px}
.modalBtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.mBtn{flex:1 1 40%;min-width:120px;padding:11px 10px;border:none;border-radius:999px;background:#57b544;color:#fff;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #3d8c31}
.mBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #3d8c31}
.mBtn.ghost{background:#fff;color:#3f7c2b;border:2px solid #c6e6a8;box-shadow:0 3px 0 #ddeecb}
.fieldLabel{font-size:12px;color:#6b9159;margin:12px 0 6px;font-weight:700}
.inp{width:100%;border:2px solid #d3e8bb;background:#fff;border-radius:12px;padding:10px 12px;font-size:14px;color:#2f5b24;outline:none}
.inp:focus{border-color:#8fd06a}
.avatarGrid{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.avOpt{width:56px;height:56px;border-radius:50%;object-fit:cover;cursor:pointer;border:3px solid transparent;background:#eef8e3}
.avOpt.emoji{display:flex;align-items:center;justify-content:center;font-size:28px}
.avOpt.active{border-color:#57b544}
.avOpt.up{border:2px dashed #9fd06f;background:#f2fbe6;display:flex;align-items:center;justify-content:center;font-size:24px;color:#57b544;font-weight:800;overflow:hidden}
.avOpt.up.active{border:3px solid #57b544;border-style:solid}
.avOpt img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.rankRow{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;background:#f3fae8;margin-bottom:6px}
.rankRow.me{background:#e2f4cd;border:2px solid #a6d67e}
.rankNo{width:22px;text-align:center;font-weight:900;font-size:13px;color:#6b9159}
.rankNo.top1{color:#e8a521}.rankNo.top2{color:#8f9fa8}.rankNo.top3{color:#c07a3b}
.rankInfo{flex:1;min-width:0}
.rankName{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rankSub{font-size:11px;color:#7c9c67;margin-top:1px}
.rankScore{font-size:14px;font-weight:900;color:#4f9c31}
.codeBox{width:100%;height:76px;font-size:11px;border:2px solid #d3e8bb;border-radius:12px;padding:8px;background:#fff;color:#3f7c2b;resize:none;word-break:break-all}
.emptyTip{text-align:center;font-size:13px;color:#7c9c67;padding:24px 0}
.warnTip{font-size:11px;color:#b06a2c;background:#fff4e5;border-radius:10px;padding:8px 10px;margin-top:10px;line-height:1.6}
</style>
</head>
<body>

<!-- ========== 开始页 ========== -->
<div id="startPage" class="page">
  <div class="userCard" onclick="openProfile()">
    <span id="startAvatarWrap"></span>
    <div>
      <div class="uname" id="startName">爱瑞瑞</div>
      <div class="usub">点击设置头像和昵称</div>
    </div>
  </div>
  <img class="mascotBig" id="startMascot" alt="咪菇">
  <h1 class="title">连连瑞瑞看</h1>
  <p class="subtitle">和咪菇一起玩连连看吧~</p>
  <button class="btnPrimary" onclick="goMap()">开始游戏</button>
  <button class="btnChallenge" onclick="startChallenge()">🔥 挑战模式 · 18 关连打</button>
  <div class="rowBtns">
    <button class="btnGhost" onclick="openProfile()">资料</button>
    <button class="btnGhost" onclick="openSave()">存档</button>
    <button class="btnGhost" onclick="openRank()">排行</button>
  </div>
  <div class="audioRow">
    <button class="chipBtn" id="musicBtn" onclick="toggleMusic()">🎵 音乐</button>
    <button class="chipBtn" id="soundBtn" onclick="toggleSound()">🔔 音效</button>
  </div>
  <div class="rules">点击两个相同的方块，它们之间的连线不超过两个折点就能消除哦~<br>消除全部方块即可通关！</div>
  <a class="qqLink" href="https://c6.y.qq.com/base/fcgi-bin/u?__=tteVbFEgqtW3" target="_blank" rel="noopener">听张函瑞《Baby's Horizon》</a>
</div>

<!-- ========== 地图页 ========== -->
<div id="mapPage" class="page hidden">
  <div class="mapHeader">
    <button class="btnBack" onclick="goStart()">← 返回</button>
    <div class="mapTitle">🌿 闯关地图 🌿</div>
  </div>
  <div id="mapViewport"><div id="mapCanvas"></div></div>
  <div class="mapTip">上下拖动查看地图，点击关卡进关（已通关的可重复挑战）</div>
</div>

<!-- ========== 游戏页 ========== -->
<div id="gamePage" class="page hidden">
  <div class="hudRow1">
    <div class="miniUser">
      <span id="gameAvatarWrap"></span>
      <div class="unameSm" id="gameName">爱瑞瑞</div>
    </div>
    <div class="hearts" id="hearts"></div>
  </div>
  <div class="hudRow2">
    <div class="levelBadge" id="levelBadge">★ 第 1 关</div>
    <div class="timeWrap">
      <span style="font-size:14px">⏱</span>
      <div class="timeBar"><div class="timeFill" id="timeFill"></div></div>
      <div class="timeText" id="timeText">240s</div>
    </div>
  </div>
  <div class="hudRow3">
    <img class="mascotSm" id="gameMascot" alt="咪菇">
    <div class="bubble" id="bubble">继续加油！</div>
  </div>
  <div class="hudRow4">
    <button class="toolBtn" id="hintBtn" onclick="doHint()">💡 提示 <span id="hintNum">5</span></button>
    <button class="toolBtn" id="shuffleBtn" onclick="doShuffle()">🔀 重排 <span id="shuffleNum">3</span></button>
    <button class="toolBtn" onclick="openPause()">⏸ 暂停</button>
  </div>
  <div id="boardWrap"><div id="boardBox"><div id="board"></div></div></div>
</div>

<div id="modalRoot">
  <div id="modalMask" onclick="onMaskClick()"></div>
  <div id="modalCard"></div>
</div>

/* ---------------- 存档 ---------------- */
var STORE_KEY = "llr_save_v1";
var state = null;

function randomName(){
  return "爱瑞瑞" + (1000 + Math.floor(Math.random() * 9000));
}
function defaultState(){
  return {
    name: randomName(),
    avatar: DEFAULT_AVATAR,
    unlocked: 1,
    stars: {},
    best: {},
    sound: true,
    music: true,
    records: [],
    chRecords: [],
    aliases: []
  };
}

function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    var o = JSON.parse(raw);
    var d = defaultState();
    for(var k in d){ if(!(k in o)) o[k] = d[k]; }
    if(!Array.isArray(o.records)) o.records = [];
    if(!Array.isArray(o.chRecords)) o.chRecords = [];
    return o;
  }catch(e){ return defaultState(); }
}

function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

/* ---------------- 头像渲染 ---------------- */
function avatarHTML(cls){
  if(!state) state = defaultState();
  var a = state.avatar || DEFAULT_AVATAR;
  if(a.indexOf("emoji:") === 0){
    return '<div class="avatar ' + (cls||'') + ' avatarEmoji">' + a.slice(6) + '</div>';
  }
  /* 图片坏了（本地存储里的头像被截断/失效）自动退回默认咪菇头像 */
  return '<img class="avatar ' + (cls||'') + '" src="' + a + '" alt="头像" onerror="this.onerror=null;this.src=DEFAULT_AVATAR;">';
}

/* ---------------- 音效（Web Audio 合成） ---------------- */
var AC = null;
function ac(){
  if(!AC){
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; }
  }
  if(AC && AC.state === "suspended"){ AC.resume(); }
  return AC;
}
function tone(freq, dur, type, gain, delay){
  if(!state.sound) return;
  var c = ac(); if(!c) return;
  var t0 = c.currentTime + (delay || 0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain || 0.06, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfxSelect(){ tone(880, .08, "triangle", .045); tone(660, .09, "triangle", .035, .05); }
function sfxMatch(){
  tone(659, .12, "sine", .07);
  tone(880, .12, "sine", .06, .09);
  tone(1046, .2, "sine", .05, .18);
  tone(523, .22, "triangle", .03, .02);
  tone(784, .22, "triangle", .03, .02);
}
function sfxError(){ tone(220, .16, "sawtooth", .05); tone(165, .18, "sawtooth", .04, .12); }
function sfxHint(){ tone(1174, .1, "sine", .05); tone(1568, .14, "sine", .04, .1); }
function sfxShuffle(){ tone(784, .1, "triangle", .04); tone(659, .1, "triangle", .04, .08); tone(523, .16, "triangle", .04, .16); }
function sfxWin(){

  for(var i=0;i<seq.length;i++) tone(seq[i], .12, "sine", .055, i*0.1);
  tone(523,.5,"triangle",.04,.85); tone(659,.5,"triangle",.04,.85); tone(1046,.5,"triangle",.035,.85);
}
function sfxLose(){

/* ---------------- 背景音乐（合成循环） ---------------- */
var MELODY = [
  [523,0.5],[659,0.5],[784,0.5],[659,0.5],
  [587,0.5],[784,0.5],[880,0.5],[784,0.5],
  [659,0.5],[784,0.5],[988,0.5],[880,0.5],
  [784,0.5],[659,0.5],[587,0.5],[523,0.5]
];
var BASS = [262, 262, 330, 330, 349, 349, 294, 294];
var musicTimer = null, musicIdx = 0, bassIdx = 0, beatIdx = 0;
function playMusicTick(){
  if(!state.music) return;
  var c = ac(); if(!c) return;
  var note = MELODY[musicIdx % MELODY.length];
  musicIdx++;
  var o = c.createOscillator(), g = c.createGain();
  o.type = "sine";
  o.frequency.value = note[0];
  g.gain.setValueAtTime(0.0001, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.028, c.currentTime + .03);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + note[1] * .9);
  o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime + note[1]);
  // 高八度泛光
  var o2 = c.createOscillator(), g2 = c.createGain();
  o2.type = "sine"; o2.frequency.value = note[0] * 2;
  g2.gain.setValueAtTime(0.0001, c.currentTime);
  g2.gain.exponentialRampToValueAtTime(0.01, c.currentTime + .02);
  g2.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + note[1] * .7);
  o2.connect(g2); g2.connect(c.destination);
  o2.start(); o2.stop(c.currentTime + note[1]);
  beatIdx++;
  if(beatIdx % 4 === 0){
    var b = BASS[bassIdx % BASS.length]; bassIdx++;
    var ob = c.createOscillator(), gb = c.createGain();
    ob.type = "triangle"; ob.frequency.value = b;
    gb.gain.setValueAtTime(0.0001, c.currentTime);
    gb.gain.exponentialRampToValueAtTime(0.03, c.currentTime + .03);
    gb.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + .8);
    ob.connect(gb); gb.connect(c.destination);
    ob.start(); ob.stop(c.currentTime + .85);
  }
}
function startMusic(){
  if(musicTimer || !state.music) return;
  ac();
  musicTimer = setInterval(playMusicTick, 480);
}

function handleAvatarFile(input){
  var file = input.files && input.files[0];

  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var size = 200;
      var cv = document.createElement("canvas");
      cv.width = size; cv.height = size;
      var ctx = cv.getContext("2d");
      var side = Math.min(img.width, img.height);
      var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);

/* ---------------- 存档码 ---------------- */
function makeCode(){

    v: 1,
    n: state.name,
    a: state.avatar,
    u: state.unlocked,
    s: state.stars,
    b: state.best
  };
  var txt = JSON.stringify(payload);
  var b64 = btoa(unescape(encodeURIComponent(txt)));
  return "LLR" + b64 + "END";
}
function parseCode(code){
  try{
    var c = String(code).trim();
    if(c.indexOf("LLR") !== 0) return null;
    if(c.length < 3 || c.slice(-3) !== "END") return null;
    var b64 = c.slice(3, -3);
    var txt = decodeURIComponent(escape(atob(b64)));
    var o = JSON.parse(txt);
    if(!o || typeof o !== "object") return null;
    return o;
  }catch(e){ return null; }
}

/* ---------------- 排行榜（仅本机真实记录） ---------------- */
function sbReq(path, opt, timeoutMs){
  opt = opt || {};
  /* key 走网址参数，不发自定义请求头——很多手机内置浏览器会拦掉预检请求 */
  var url = SB_URL + "/rest/v1/" + path + (path.indexOf("?") >= 0 ? "&" : "?") + "apikey=" + encodeURIComponent(SB_KEY);
  var headers = {};
  if(opt.body){ headers["Content-Type"] = "application/json"; }
  var opts = { method: opt.method || "GET", headers: headers, body: opt.body };
  if(opt.headers){ for(var k in opt.headers){ headers[k] = opt.headers[k]; } }
  var ctrl = null, timer = null;
  try{ if(typeof AbortController !== "undefined"){ ctrl = new AbortController(); opts.signal = ctrl.signal; } }catch(e){}
  var req = fetch(url, opts);
  if(ctrl){
    timer = setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, timeoutMs || 9000);
  }
  return req.then(function(r){
    if(timer){ clearTimeout(timer); timer = null; }
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }, function(e){
    if(timer){ clearTimeout(timer); timer = null; }
    throw e;
  });
}

function rankAvatar(av){
  if(!av) return "mascot";
  if(av.indexOf("emoji:") === 0) return av;
  /* 自定义上传头像：直接传压缩后的小图 dataURL，其他设备才看得到 */
  if(av.indexOf("data:") === 0 && av !== DEFAULT_AVATAR) return av;
  return "mascot";
}

function submitScore(mode, level, score){
  if(!level || level < 1) return;
  var body = JSON.stringify([{ mode: mode, name: state.name, avatar: rankAvatar(state.avatar), level: level, score: score }]);
  try{
    sbReq("llr_scores?select=id", {
      method: "POST",
      body: body
    }).catch(function(){
      pushPending(body);
    });
  }catch(e){
    pushPending(body);
  }
}

function pushPending(body){
  try{
    var q = [];
    try{ q = JSON.parse(localStorage.getItem("llr_pending") || "[]") || []; }catch(e){ q = []; }
    if(q.length > 20) q = q.slice(q.length - 20);
    q.push(body);
    localStorage.setItem("llr_pending", JSON.stringify(q));
  }catch(e){}
}

function flushPending(){
  try{
    var q = [];
    try{ q = JSON.parse(localStorage.getItem("llr_pending") || "[]") || []; }catch(e){ q = []; }
    if(!q.length) return;
    localStorage.setItem("llr_pending", "[]");
    q.forEach(function(body){
      try{
        sbReq("llr_scores?select=id", { method: "POST", body: body }).catch(function(){ pushPending(body); });
      }catch(e){ pushPending(body); }
    });
  }catch(e){}
}

function fetchScores(mode, cb){
  try{
    sbReq("llr_scores?mode=eq." + mode + "&select=name,avatar,level,score&order=level.desc,score.desc&limit=200")
      .then(function(rows){ cb(null, rows || []); })
      .catch(function(e){ cb(e || new Error("net")); });
  }catch(e){ cb(e); }
}

function dedupeScores(rows){
  var map = {}, out = [];
  for(var i=0;i<rows.length;i++){
    var r = rows[i], k = String(r.name || "").trim();
    if(!k) continue;
    if(!map[k]){ map[k] = { name:k, avatar:r.avatar, level:r.level, score:r.score }; out.push(map[k]); }
    else if(r.level > map[k].level || (r.level === map[k].level && r.score > map[k].score)){
      map[k].level = r.level; map[k].score = r.score; map[k].avatar = r.avatar;
    }
  }
  out.sort(function(a,b){ if(b.level !== a.level) return b.level - a.level; return b.score - a.score; });
  return out;
}

function recordResult(level, score, timeUsed){
  var list = state.records || [];
  var found = null;
  for(var i=0;i<list.length;i++){
    if(list[i].name === state.name){ found = list[i]; break; }
  }
  if(!found){
    found = { name: state.name, avatar: state.avatar, level: level, score: score };
    list.push(found);
  }
  found.avatar = state.avatar;
  if(level >= found.level && score >= found.score){
    found.level = Math.max(found.level, level);
    found.score = Math.max(found.score, score);
  }
  found.level = Math.max(found.level, level);
  found.score = Math.max(found.score, score);
  state.records = list;
  saveState();
  submitScore("normal", level, score);
}

function agoText(ms){
  var min = Math.floor((ms || 0) / 60000);
  if(min < 1) return "刚刚";
  if(min < 60) return min + " 分钟前";
  var h = Math.floor(min / 60);
  if(h < 24) return h + " 小时前";
  return Math.floor(h / 24) + " 天前";
}

function rankCacheKey(mode){ return "llr_rank_cache_" + mode; }

function saveRankCache(mode, rows){
  try{ localStorage.setItem(rankCacheKey(mode), JSON.stringify({ t: Date.now(), rows: rows })); }catch(e){}
}

function readRankCache(mode){
  try{
    var raw = localStorage.getItem(rankCacheKey(mode));
    if(!raw) return null;
    var o = JSON.parse(raw);
    if(!o || !o.rows) return null;
    return o;
  }catch(e){ return null; }
}

function loadRemoteRank(mode, tries, cb){
  var delays = [1200, 3000];
  (function attempt(n){
    fetchScores(mode, function(err, rows){
      if(!err){
        lastRankErr = null;
        rankMem[mode] = rows || [];
        saveRankCache(mode, rows || []);
        cb(rows || [], false, 0);
        return;
      }
      if(n > 0){
        var d = delays[Math.min(delays.length - 1, 2 - n)] || 2000;
        setTimeout(function(){ attempt(n - 1); }, d);
        return;
      }
      lastRankErr = (err && (err.message || String(err))) || "网络错误";
      var c = readRankCache(mode);
      if(c) cb(c.rows, true, Date.now() - (c.t || 0), lastRankErr);
      else cb(null, false, 0, lastRankErr);
    });
  })(tries);
}

function localRankList(tab){

  var list = (isCh ? (state.chRecords || []) : (state.records || [])).slice();
  for(var i=0;i<list.length;i++){
    if(list[i].name === state.name && state.avatar) list[i].avatar = rankAvatar(state.avatar);
  }
  list.sort(function(a,b){ if(b.level !== a.level) return b.level - a.level; return b.score - a.score; });
  return list;
}

function mergeRank(remote, tab){
  /* 1) 曾用名的线上成绩统一改成当前名字 */
  var al = (state.aliases || []);
  for(var i=0;i<remote.length;i++){
    if(remote[i].name !== state.name && al.indexOf(remote[i].name) >= 0) remote[i].name = state.name;
  }
  /* 2) 同名（含改名后重合的）只留最好的一条 */
  var map = {}, out = [];
  for(var i=0;i<remote.length;i++){
    var r = remote[i], k = String(r.name || "").trim();
    if(!k) continue;
    if(!map[k]){ map[k] = { name:k, avatar:r.avatar, level:r.level, score:r.score }; out.push(map[k]); }
    else{
      var keep = map[k];
      if(r.level > keep.level || (r.level === keep.level && r.score > keep.score)){
        keep.level = r.level; keep.score = r.score;
        if(r.avatar) keep.avatar = r.avatar;
      }
    }
  }
  remote = out;
  /* 3) 我自己的头像以本机设置为准 */
  var mine = localRankList(tab)[0];
  var has = false;
  for(var i=0;i<remote.length;i++){
    if(remote[i].name === state.name){
      has = true;
      if(state.avatar) remote[i].avatar = rankAvatar(state.avatar);
      break;
    }
  }
  if(mine && !has) remote.push({ name: mine.name, avatar: mine.avatar, level: mine.level, score: mine.score });
  remote.sort(function(a,b){ if(b.level !== a.level) return b.level - a.level; return b.score - a.score; });
  return remote;
}

function catmullRomPath(pts){
  if(pts.length < 2) return "";
  var d = "M " + pts[0].x + " " + pts[0].y;
  for(var i=0;i<pts.length-1;i++){
    var p0 = pts[i-1] || pts[i];
    var p1 = pts[i];
    var p2 = pts[i+1];
    var p3 = pts[i+2] || pts[i+1];
    var c1x = p1.x + (p2.x - p0.x)/6;
    var c1y = p1.y + (p2.y - p0.y)/6;
    var c2x = p2.x - (p3.x - p1.x)/6;
    var c2y = p2.y - (p3.y - p1.y)/6;
    d += " C " + c1x.toFixed(1) + " " + c1y.toFixed(1) + ", " + c2x.toFixed(1) + " " + c2y.toFixed(1) + ", " + p2.x + " " + p2.y;
  }
  return d;
}

/* 地图拖动 */
var dragStartY = 0, dragOffset = 0, dragMoved = false, velocity = 0, lastY = 0, lastT = 0, inertiaTimer = null;
var mapOffset = 0;

function mapMaxOffset(){
  var vp = document.getElementById("mapViewport");
  var canvas = document.getElementById("mapCanvas");
  var vh = vp.clientHeight, ch = canvas.offsetHeight;
  return Math.min(0, vh - ch);
}
function layoutMap(){
  var vp = document.getElementById("mapViewport");
  if(!vp) return;
  var canvas = document.getElementById("mapCanvas");
  var w = vp.clientWidth;
  canvas.style.height = (w * MAP_H / MAP_W) + "px";
  mapOffset = Math.max(mapMaxOffset(), Math.min(0, mapOffset));
  canvas.style.transform = "translateY(" + mapOffset + "px)";
}
function applyOffset(v){
  var canvas = document.getElementById("mapCanvas");
  mapOffset = Math.max(mapMaxOffset() - 24, Math.min(24, v));
  canvas.style.transform = "translateY(" + mapOffset + "px)";
}
function scrollToCurrent(animate){
  var vp = document.getElementById("mapViewport");
  var canvas = document.getElementById("mapCanvas");
  if(!vp || !canvas) return;
  var p = NODES[Math.min(state.unlocked, LEVEL_COUNT) - 1];
  var nodeY = p.y / MAP_H * canvas.offsetHeight;
  var target = vp.clientHeight * 0.62 - nodeY;
  mapOffset = Math.max(mapMaxOffset(), Math.min(0, target));
  canvas.style.transition = animate ? "transform .35s ease" : "none";
  canvas.style.transform = "translateY(" + mapOffset + "px)";
  setTimeout(function(){ if(canvas) canvas.style.transition = "none"; }, 400);
}

function initMapDrag(){
  var vp = document.getElementById("mapViewport");
  if(!vp) return;
  vp.addEventListener("pointerdown", function(e){
    if(inertiaTimer){ clearInterval(inertiaTimer); inertiaTimer = null; }
    dragStartY = e.clientY;
    lastY = e.clientY;
    lastT = Date.now();
    dragOffset = mapOffset;
    dragMoved = false;
    velocity = 0;
    vp.classList.add("grabbing");
  });
  window.addEventListener("pointermove", function(e){
    if(!vp.classList.contains("grabbing")) return;
    var dy = e.clientY - dragStartY;
    if(Math.abs(dy) > 6) dragMoved = true;
    applyOffset(dragOffset + dy);
    var now = Date.now();
    var dt = now - lastT;
    if(dt > 0){ velocity = (e.clientY - lastY) / dt; }
    lastY = e.clientY; lastT = now;
  });
  function endDrag(){
    if(!vp.classList.contains("grabbing")) return;
    vp.classList.remove("grabbing");
    // 惯性
    var v = velocity * 16;
    if(Math.abs(v) > 4){
      var dir = v > 0 ? 1 : -1;
      var speed = Math.min(Math.abs(v), 60);
      inertiaTimer = setInterval(function(){
        speed *= 0.94;
        applyOffset(mapOffset + speed * dir);
        if(speed < 1.2 || mapOffset >= 0 || mapOffset <= mapMaxOffset()){
          clearInterval(inertiaTimer); inertiaTimer = null;
        }
      }, 16);
    }
    setTimeout(function(){ dragMoved = false; }, 60);
  }
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
  window.addEventListener("resize", function(){
    if(!document.getElementById("mapPage").classList.contains("hidden")) layoutMap();
  });
}

var curLevel = 1, grid = [], ROWS = 0, COLS = 0, hearts = 3, timeLeft = 0, timeTotal = 0;
var gameMode = "normal";      /* normal = 闯关模式, challenge = 挑战模式 */
var chScore = 0;              /* 挑战模式累计得分 */
var timerId = null, hints = 5, shuffles = 3, selected = null, cellSize = 40, GAP = 5;
var isGameOver = false, tileEls = {};

function buildGrid(level){
  var cfg = LEVELS[level-1];
  ROWS = cfg.r; COLS = cfg.c;
  var total = ROWS * COLS;
  var pairCount = Math.floor(total / 2);
  var pool = [];
  for(var i=0;i<pairCount;i++){
    var t = (i % cfg.t) + 1;
    pool.push(t, t);
  }
  // 洗牌
  for(var s=pool.length-1;s>0;s--){
    var r2 = Math.floor(Math.random() * (s + 1));
    var tmp = pool[s]; pool[s] = pool[r2]; pool[r2] = tmp;
  }
  grid = [];
  var idx = 0;
  for(var r=0;r<ROWS;r++){
    var row = [];
    for(var c=0;c<COLS;c++){
      row.push({type: pool[idx++]});
    }
    grid.push(row);
  }
  // 保证开局有解
  for(var guard=0;guard<60;guard++){
    if(findPair()) break;
    reshuffleGrid();
  }
}

function reshuffleGrid(){
  var cells = [];
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      if(grid[r][c]) cells.push(grid[r][c].type);
    }
  }
  for(var i=cells.length-1;i>0;i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = cells[i]; cells[i] = cells[j]; cells[j] = t;
  }
  var k = 0;
  for(var r2=0;r2<ROWS;r2++){
    for(var c2=0;c2<COLS;c2++){
      if(grid[r2][c2]) grid[r2][c2].type = cells[k++];
    }
  }
}

function occupied(r, c){
  if(r < 0 || r >= ROWS || c < 0 || c >= COLS) return false; // 边界外视为空
  return !!grid[r][c];
}
function lineEmpty(r1, c1, r2, c2){
  if(r1 === r2){
    var from = Math.min(c1, c2) + 1, to = Math.max(c1, c2) - 1;
    for(var c=from;c<=to;c++){ if(occupied(r1, c)) return false; }
    return true;
  }
  if(c1 === c2){
    var f2 = Math.min(r1, r2) + 1, t2 = Math.max(r1, r2) - 1;
    for(var r=f2;r<=t2;r++){ if(occupied(r, c1)) return false; }
    return true;
  }
  return false;
}
function linkPath(a, b){
  if(a.r === b.r && lineEmpty(a.r, a.c, b.r, b.c)) return [a, b];
  if(a.c === b.c && lineEmpty(a.r, a.c, b.r, b.c)) return [a, b];
  // 一个折点
  if(!occupied(a.r, b.c) && lineEmpty(a.r, a.c, a.r, b.c) && lineEmpty(a.r, b.c, b.r, b.c)) return [a, {r:a.r, c:b.c}, b];
  if(!occupied(b.r, a.c) && lineEmpty(a.r, a.c, b.r, a.c) && lineEmpty(b.r, a.c, b.r, b.c)) return [a, {r:b.r, c:a.c}, b];
  // 两个折点：按行扫描
  for(var r=-1;r<=ROWS;r++){
    if(r === a.r || r === b.r) continue;
    if(occupied(r, a.c) || occupied(r, b.c)) continue;
    if(lineEmpty(a.r, a.c, r, a.c) && lineEmpty(r, a.c, r, b.c) && lineEmpty(r, b.c, b.r, b.c)){
      return [a, {r:r, c:a.c}, {r:r, c:b.c}, b];
    }
  }
  // 两个折点：按列扫描
  for(var c=-1;c<=COLS;c++){
    if(c === a.c || c === b.c) continue;
    if(occupied(a.r, c) || occupied(b.r, c)) continue;
    if(lineEmpty(a.r, a.c, a.r, c) && lineEmpty(a.r, c, b.r, c) && lineEmpty(b.r, c, b.r, b.c)){
      return [a, {r:a.r, c:c}, {r:b.r, c:c}, b];
    }
  }
  return null;
}
function canLink(a, b){
  return !!linkPath(a, b);
}

/* 画出两格之间的连线（绿色，短暂闪现后淡出） */
var LINK_M = 18;
function drawLinkPath(pts){
  if(!pts || pts.length < 2) return;
  var board = document.getElementById("board");
  if(!board || !cellSize) return;
  var w = COLS * cellSize + (COLS - 1) * GAP;
  var h = ROWS * cellSize + (ROWS - 1) * GAP;
  var cv = document.getElementById("linkCanvas");
  if(!cv){
    cv = document.createElement("canvas");
    cv.id = "linkCanvas";
    cv.style.position = "absolute";
    cv.style.pointerEvents = "none";
    cv.style.zIndex = "40";
    cv.style.transition = "opacity .32s";
    board.appendChild(cv);
  }
  var M = Math.round(cellSize / 2 + GAP + 10);   // 留出棋盘外的绕行空间（-1 行/-1 列）
  var dpr = Math.min(2.5, window.devicePixelRatio || 1);
  cv.style.left = (-M) + "px";
  cv.style.top = (-M) + "px";
  cv.style.width = (w + M * 2) + "px";
  cv.style.height = (h + M * 2) + "px";
  cv.width = Math.round((w + M * 2) * dpr);
  cv.height = Math.round((h + M * 2) * dpr);
  var ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w + M * 2, h + M * 2);
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "rgba(87,181,68,.96)";
  ctx.shadowColor = "rgba(87,181,68,.5)";
  ctx.shadowBlur = 8;
  var pass = [["rgba(255,255,255,.95)", 8], ["rgba(87,181,68,.96)", 4]];
  for(var k=0;k<pass.length;k++){
    ctx.lineWidth = pass[k][1];
    ctx.strokeStyle = pass[k][0];
    ctx.beginPath();
    for(var i=0;i<pts.length;i++){
      var p = pts[i];
      var x = M + p.c * (cellSize + GAP) + cellSize / 2;
      var y = M + p.r * (cellSize + GAP) + cellSize / 2;
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  cv.style.opacity = "1";
  if(cv._t1) clearTimeout(cv._t1);
  if(cv._t2) clearTimeout(cv._t2);
  cv._t1 = setTimeout(function(){ if(cv) cv.style.opacity = "0"; }, 230);
  cv._t2 = setTimeout(function(){
    try{
      var c2 = cv.getContext("2d");
      c2.setTransform(1, 0, 0, 1, 0, 0);
      c2.clearRect(0, 0, cv.width, cv.height);
    }catch(e){}
  }, 700);
}

function findPair(){
  var list = [];
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      if(grid[r][c]) list.push({r:r, c:c, type:grid[r][c].type});
    }
  }
  for(var i=0;i<list.length;i++){
    for(var j=i+1;j<list.length;j++){
      if(list[i].type === list[j].type && canLink(list[i], list[j])){
        return [list[i], list[j]];
      }
    }
  }
  return null;
}

function remainingCount(){
  var n = 0;
  for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++) if(grid[r][c]) n++;
  return n;
}

/* ---------------- 棋盘渲染 ---------------- */
function computeCellSize(){
  var wrap = document.getElementById("boardWrap");
  GAP = (ROWS * COLS >= 100) ? 3 : (ROWS * COLS >= 60 ? 4 : 6);
  var maxW = wrap.clientWidth - 8;
  var maxH = wrap.clientHeight - 12;
  var byW = (maxW - (COLS - 1) * GAP) / COLS;
  var byH = (maxH - (ROWS - 1) * GAP) / ROWS;
  cellSize = Math.max(18, Math.floor(Math.min(byW, byH)));
}

function renderBoard(){
  var board = document.getElementById("board");
  var box = document.getElementById("boardBox");
  computeCellSize();
  var w = COLS * cellSize + (COLS - 1) * GAP;
  var h = ROWS * cellSize + (ROWS - 1) * GAP;
  board.style.width = w + "px";
  board.style.height = h + "px";
  box.style.padding = "6px";
  board.innerHTML = "";
  tileEls = {};
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      var cell = grid[r][c];
      if(!cell) continue;
      var el = document.createElement("div");
      el.className = "tile";
      el.style.width = cellSize + "px";
      el.style.height = cellSize + "px";
      el.style.left = (c * (cellSize + GAP)) + "px";
      el.style.top = (r * (cellSize + GAP)) + "px";
      var img = document.createElement("img");
      img.src = PHOTOS[(cell.type - 1) % PHOTOS.length];
      img.alt = "";
      img.loading = "eager";
      el.appendChild(img);
      (function(rr, cc, el2){
        el2.onclick = function(){ onTileClick(rr, cc, el2); };
      })(r, c, el);
      board.appendChild(el);
      tileEls[r + "_" + c] = el;
    }
  }
}

function onTileClick(r, c, el){
  if(isGameOver) return;
  if(!grid[r][c]) return;
  if(dragMoved) return;
  if(selected && selected.r === r && selected.c === c){
    el.classList.remove("sel");
    selected = null;
    return;
  }
  if(!selected){
    selected = {r:r, c:c, el:el};
    el.classList.add("sel");
    sfxSelect();
    return;
  }
  var first = selected;
  if(grid[first.r][first.c].type !== grid[r][c].type){
    // 图案不同：扣心
    blockWrong(first.el, el);
    selected = null;
    loseHeart();
    return;
  }
  if(!canLink({r:first.r, c:first.c}, {r:r, c:c})){
    blockWrong(first.el, el);
    selected = null;
    loseHeart();
    return;
  }
  // 成功消除
  drawLinkPath(linkPath({r:first.r, c:first.c}, {r:r, c:c}));
  first.el.classList.remove("sel");
  first.el.classList.add("gone");
  el.classList.add("gone");
  grid[first.r][first.c] = null;
  grid[r][c] = null;
  selected = null;
  sfxMatch();
  setBubble(pickBubble(true));
  var f1 = first.el, f2 = el;
  setTimeout(function(){
    if(f1.parentNode) f1.parentNode.removeChild(f1);
    if(f2.parentNode) f2.parentNode.removeChild(f2);
  }, 260);
  if(remainingCount() === 0){
    setTimeout(winLevel, 320);
    return;
  }
  // 无解自动重排
  setTimeout(function(){
    if(!isGameOver && !findPair()){
      reshuffleGrid();
      renderBoard();
      setBubble("没路啦，我帮你重新排了一下~");
      sfxShuffle();
    }
  }, 260);
}

function blockWrong(elA, elB){
  elA.classList.remove("sel");
  elA.classList.add("shake");
  elB.classList.add("shake");
  setTimeout(function(){
    elA.classList.remove("shake");
    elB.classList.remove("shake");
  }, 340);
  sfxError();
}

function loseHeart(){
  hearts--;
  renderHearts();
  setBubble("呜呜，扣了一颗心…");
  if(hearts <= 0){
    failLevel("三颗心都用完啦");
  }
}

function renderHearts(){
  var el = document.getElementById("hearts");
  var s = "";
  for(var i=0;i<3;i++){
    s += '<span class="' + (i < hearts ? "" : "heartDead") + '">💚</span>';
  }
  el.innerHTML = s;
}

function setBubble(txt){
  var b = document.getElementById("bubble");
  if(b) b.textContent = txt;
}
var BUBBLE_GOOD = ["继续加油！","瑞瑞看着你哦~","这一对消得漂亮！","稳住，能赢！","咪菇给你打气~"];
function pickBubble(){
  return BUBBLE_GOOD[Math.floor(Math.random() * BUBBLE_GOOD.length)];
}

/* ---------------- 计时 ---------------- */
function startTimer(){
  stopTimer();
  timerId = setInterval(function(){
    if(isGameOver) return;
    timeLeft--;
    updateTimeUI();
    if(timeLeft <= 0){
      failLevel("时间到啦");
    }
  }, 1000);
}
function stopTimer(){
  if(timerId){ clearInterval(timerId); timerId = null; }
}
function updateTimeUI(){
  var fill = document.getElementById("timeFill");
  var txt = document.getElementById("timeText");
  var ratio = Math.max(0, timeLeft / timeTotal);
  fill.style.width = (ratio * 100) + "%";
  fill.style.background = ratio > 0.5 ? "#7cc85a" : ratio > 0.25 ? "#f0c14b" : "#e8695a";
  txt.textContent = Math.max(0, timeLeft) + "s";
}

function updateToolUI(){
  document.getElementById("hintNum").textContent = hints;
  document.getElementById("shuffleNum").textContent = shuffles;
  document.getElementById("hintBtn").disabled = hints <= 0 || isGameOver;
  document.getElementById("shuffleBtn").disabled = shuffles <= 0 || isGameOver;
}

function doHint(){
  if(isGameOver || hints <= 0 || !selected) {
    if(hints <= 0) return;
  }
  if(hints <= 0) return;
  var pair = findPair();
  if(!pair) return;
  hints--;
  updateToolUI();
  sfxHint();
  var e1 = tileEls[pair[0].r + "_" + pair[0].c];
  var e2 = tileEls[pair[1].r + "_" + pair[1].c];
  if(e1) e1.classList.add("hint");
  if(e2) e2.classList.add("hint");
  setBubble("看这两张～");
  setTimeout(function(){
    if(e1) e1.classList.remove("hint");
    if(e2) e2.classList.remove("hint");
  }, 2600);
}

function doShuffle(){
  if(isGameOver || shuffles <= 0) return;
  shuffles--;
  updateToolUI();
  sfxShuffle();
  if(selected){ selected.el.classList.remove("sel"); selected = null; }
  reshuffleGrid();
  renderBoard();
  setBubble("重新排好啦~");
}

/* ---------------- 关卡流程 ---------------- */
function startLevel(level, keepHearts){
  curLevel = level;
  var cfg = LEVELS[level-1];
  if(!keepHearts) hearts = 3;
  var isCh = (gameMode === "challenge");
  if(isCh){
    hints = 0;
    shuffles = 0;
    timeTotal = Math.max(60, Math.round(cfg.time * 0.7));
  }else{
    hints = cfg.h;
    shuffles = cfg.s;
    timeTotal = cfg.time;
  }
  timeLeft = timeTotal;
  selected = null;
  isGameOver = false;
  goGame();
  buildGrid(level);
  renderBoard();
  renderHearts();
  updateToolUI();
  updateTimeUI();
  document.getElementById("levelBadge").textContent = isCh ? ("🔥 挑战 第 " + level + " 关") : ("★ 第 " + level + " 关");
  document.getElementById("hintBtn").style.display = isCh ? "none" : "";
  document.getElementById("shuffleBtn").style.display = isCh ? "none" : "";
  setBubble(isCh ? ("挑战第 " + level + " 关，冲！") : ("第 " + level + " 关开始！"));
  document.getElementById("gameMascot").src = MASCOT;
  startTimer();
  startMusic();
  saveState();
}

function startChallenge(){
  gameMode = "challenge";
  chScore = 0;
  closeModal();
  startLevel(1, false);
}

function recordChallenge(levelReached, score){
  var list = state.chRecords || [];
  var found = null;
  for(var i=0;i<list.length;i++){
    if(list[i].name === state.name){ found = list[i]; break; }
  }
  if(!found){
    found = {name: state.name, avatar: state.avatar, level: levelReached, score: score};
    list.push(found);
  }
  if(levelReached > found.level || score > found.score){
    found.level = Math.max(found.level, levelReached);
    found.score = Math.max(found.score, score);
  }
  found.avatar = state.avatar;
  state.chRecords = list;
  saveState();
  submitScore("challenge", levelReached, score);
}

function endChallenge(){
  recordChallenge(Math.max(0, curLevel - 1), chScore);
  gameMode = "normal";
  closeModal();
  goStart();
}

function winLevel(){
  if(isGameOver) return;
  isGameOver = true;
  stopTimer();
  var ratio = timeLeft / timeTotal;
  var stars = ratio >= 0.55 ? 3 : ratio >= 0.28 ? 2 : 1;
  var score = timeLeft * 10 + hearts * 50 + curLevel * 30;
  state.stars[curLevel] = Math.max(state.stars[curLevel] || 0, stars);
  state.best[curLevel] = Math.max(state.best[curLevel] || 0, score);
  if(curLevel + 1 <= LEVEL_COUNT && state.unlocked < curLevel + 1){
    state.unlocked = curLevel + 1;
  }
  recordResult(curLevel, score, timeTotal - timeLeft);
  saveState();
  sfxWin();
  if(gameMode === "challenge"){
    chScore += score;
    if(curLevel >= LEVEL_COUNT){
      recordChallenge(LEVEL_COUNT, chScore);
      gameMode = "normal";
      var doneHtml = '<div class="modalTitle">🏆 挑战全部通关</div>';
      doneHtml += '<div style="text-align:center"><img src="' + MASCOT + '" style="width:118px;animation:hop 1.4s ease-in-out infinite"></div>';
      doneHtml += '<div class="modalText">18 关全部打通！挑战总分 <b>' + chScore + '</b> 分<br>接下去的关卡再困难也陪着瑞瑞继续走下去吧～</div>';
      doneHtml += '<div class="modalBtns"><button class="mBtn ghost" onclick="closeModal();goStart()">回首页</button>';
      doneHtml += '<button class="mBtn" onclick="startChallenge()">再来一次</button></div>';
      openModal(doneHtml, "over");
      return;
    }
    var chHtml = '<div class="modalTitle">🔥 挑战第 ' + curLevel + ' 关通过</div>';
    chHtml += '<div style="text-align:center"><img src="' + MASCOT + '" style="width:104px;animation:hop 1.4s ease-in-out infinite"></div>';
    chHtml += '<div class="modalText">本关 ' + score + ' 分，累计 <b>' + chScore + '</b> 分<br>还有 ' + (LEVEL_COUNT - curLevel) + ' 关等着你，心跳还在加速～</div>';
    chHtml += '<div class="modalBtns"><button class="mBtn ghost" onclick="endChallenge()">结束挑战</button>';
    chHtml += '<button class="mBtn" onclick="closeModal();startLevel(' + (curLevel + 1) + ', true)">继续挑战</button></div>';
    openModal(chHtml, "over");
    return;
  }
  var isLast = curLevel >= LEVEL_COUNT;
  var starStr = "";
  for(var i=1;i<=3;i++) starStr += '<span style="color:' + (i <= stars ? "#ffc93c" : "#d8e6c6") + '">★</span>';
  var html = '<div class="modalTitle">🎉 咪菇为你鼓掌</div>';
  html += '<div style="text-align:center;margin:2px 0 2px"><img src="' + MASCOT + '" style="width:118px;animation:hop 1.4s ease-in-out infinite"></div>';
  html += '<div style="text-align:center;font-size:30px;letter-spacing:6px;margin:4px 0 12px">' + starStr + '</div>';
  html += '<div class="modalText">得分 ' + score + ' 分 · 剩余 ' + Math.max(0, timeLeft) + ' 秒<br>接下去的关卡再困难也陪着瑞瑞继续走下去吧～</div>';
  html += '<div class="modalBtns">';
  if(isLast){
    html += '<button class="mBtn" onclick="closeModal();goMap()">全部通关！回地图</button>';
  }else{
    html += '<button class="mBtn ghost" onclick="closeModal();goMap()">返回地图</button>';
    html += '<button class="mBtn" onclick="closeModal();startLevel(' + (curLevel + 1) + ')">下一关</button>';
  }
  html += '</div>';
  openModal(html, "over");
}

function failLevel(reason){
  if(isGameOver) return;
  isGameOver = true;
  stopTimer();
  sfxLose();
  if(gameMode === "challenge"){
    var done = Math.max(0, curLevel - 1);
    recordChallenge(done, chScore);
    gameMode = "normal";
    var chFail = '<div class="modalTitle">挑战结束</div>';
    chFail += '<div class="sadWrap"><img src="' + MASCOT + '" alt="哭泣的咪菇"><div class="tear l"></div><div class="tear r"></div></div>';
    chFail += '<div class="modalText">' + reason + '，这次闯到第 ' + done + ' 关，挑战分 ' + chScore + '<br>别灰心，瑞瑞还在这儿等你～</div>';
    chFail += '<div class="modalBtns"><button class="mBtn ghost" onclick="closeModal();goStart()">回首页</button>';
    chFail += '<button class="mBtn" onclick="startChallenge()">再来一次</button></div>';
    openModal(chFail, "over");
    return;
  }
  var html = '<div class="modalTitle">这关差一点点</div>';
  html += '<div class="sadWrap"><img src="' + MASCOT + '" alt="哭泣的咪菇"><div class="tear l"></div><div class="tear r"></div></div>';
  html += '<div class="modalText">' + reason + '，别灰心，瑞瑞还在这儿等你～</div>';
  html += '<div class="modalBtns"><button class="mBtn ghost" onclick="closeModal();goMap()">返回地图</button>';
  html += '<button class="mBtn" onclick="closeModal();startLevel(' + curLevel + ')">再来一次</button></div>';
  openModal(html, "over");
}

/* ---------------- 暂停 ---------------- */
function openPause(){
  stopTimer();
  var html = '<div class="modalTitle">休息一下</div>';
  html += '<div style="text-align:center"><img src="' + MASCOT + '" style="width:96px;margin:4px 0 8px"></div>';
  html += '<div class="modalText" style="font-size:14px;font-weight:700;color:#4f9c31">休息一下，瑞瑞会一直等你～加油哦！</div>';
  html += '<div class="modalText">点击继续游戏，回到闯关之旅~</div>';
  html += '<div class="modalBtns"><button class="mBtn ghost" onclick="closeModal();goMap()">返回地图</button>';
  html += '<button class="mBtn" onclick="resumeGame()">继续游戏</button></div>';
  openModal(html, "pause");
  saveState();
}
function resumeGame(){
  closeModal();
  if(!isGameOver) startTimer();
}

/* ---------------- 初始化 ---------------- */
function init(){
  state = loadState();
  document.getElementById("startMascot").src = MASCOT;
  document.getElementById("gameMascot").src = MASCOT;
  refreshUserUI();
  refreshAudioBtns();
  initMapDrag();
  // 首次点击启动音频
  var started = false;
  function firstTouch(){
    if(started) return;
    started = true;
    ac();
    if(state.music) startMusic();
  }
  document.addEventListener("pointerdown", firstTouch, { once: true });

  // 自动存档
  window.addEventListener("beforeunload", function(){ saveState(); });
  window.addEventListener("pagehide", function(){ saveState(); });
  document.addEventListener("visibilitychange", function(){
    saveState();
    if(document.hidden){ /* 切后台暂停计时 */ }
  });
  window.addEventListener("resize", function(){
    if(!document.getElementById("gamePage").classList.contains("hidden") && !isGameOver){
      renderBoard();
    }
  });
}
init();
</script>
